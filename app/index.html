<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="快捷日程表">
<meta name="theme-color" content="#3d61b8">
<title>快捷日程表</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #f2f4f8;
    --card: #ffffff;
    --accent: #3d61b8;
    --accent-soft: #e8edf9;
    --text: #1c1f26;
    --text-2: #6b7280;
    --danger: #e05a5a;
    --ok: #3aa76d;
    --radius: 16px;
    --shadow: 0 2px 10px rgba(28, 52, 120, .08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    padding: calc(12px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 480px; margin: 0 auto; }

  header { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 2px 14px; }
  header h1 { font-size: 26px; margin: 0; letter-spacing: .5px; }
  header .date { font-size: 13px; color: var(--text-2); text-align: right; line-height: 1.5; }
  header .date b { display: block; font-size: 15px; color: var(--text); }

  .stats { display: flex; gap: 10px; margin-bottom: 14px; }
  .stat { flex: 1; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; }
  .stat .num { font-size: 22px; font-weight: 700; color: var(--accent); }
  .stat .lbl { font-size: 12px; color: var(--text-2); margin-top: 2px; }

  .input-card {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 14px; margin-bottom: 14px;
  }
  .input-card .row { display: flex; gap: 10px; }
  .input-card input[type=text] {
    flex: 1; min-width: 0; font-size: 16px; padding: 12px 14px; border: 1px solid #dfe4ee;
    border-radius: 12px; outline: none; background: #fafbfe;
  }
  .input-card input[type=text]:focus { border-color: var(--accent); background: #fff; }
  .input-card .btn-add {
    background: var(--accent); color: #fff; border: 0; border-radius: 12px; font-size: 16px;
    padding: 0 18px; flex-shrink: 0; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .input-card .btn-add svg { width: 17px; height: 17px; }
  .input-card .btn-add:active { opacity: .8; }
  .quick-row { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 2px; }
  .chip {
    border: 0; background: var(--accent-soft); color: var(--accent); border-radius: 999px;
    font-size: 13px; padding: 7px 13px; white-space: nowrap; flex-shrink: 0;
  }
  .chip.active { background: var(--accent); color: #fff; }
  .time-row { margin-top: 10px; display: flex; align-items: center; gap: 8px; }
  .time-row label { font-size: 13px; color: var(--text-2); }
  .time-row input[type=datetime-local] {
    font-size: 14px; padding: 7px 9px; border: 1px solid #dfe4ee; border-radius: 10px;
    background: #fafbfe; color: var(--text); outline: none;
  }

  .tabs { display: flex; gap: 8px; margin: 0 2px 12px; }
  .tab {
    flex: 1; text-align: center; padding: 8px 0; border-radius: 999px; font-size: 14px;
    background: transparent; color: var(--text-2); border: 1px solid #dfe4ee; background: var(--card);
  }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }

  ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .item {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 12px 14px; display: flex; align-items: center; gap: 12px;
  }
  .item .check {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid #c9d2e6; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .item.done .check { background: var(--ok); border-color: var(--ok); color: #fff; font-size: 13px; }
  .item .check svg { width: 14px; height: 14px; }
  .item:not(.done) .check svg { display: none; }
  .item .body { flex: 1; min-width: 0; }
  .item .txt { font-size: 16px; word-break: break-all; }
  .item.done .txt { color: var(--text-2); text-decoration: line-through; }
  .item .when { font-size: 12px; color: var(--text-2); margin-top: 3px; }
  .item .when .tag { color: var(--accent); font-weight: 600; }
  .item.del {
    border: 0; background: transparent; color: var(--danger); padding: 6px 8px;
    flex-shrink: 0; border-radius: 8px; display: flex; align-items: center;
  }
  .item.del svg { width: 16px; height: 16px; }
  .empty { text-align: center; color: var(--text-2); font-size: 14px; padding: 36px 0 10px; }
  .empty svg { width: 44px; height: 44px; color: #c9d2e6; margin-bottom: 8px; }
  h1 svg { width: 24px; height: 24px; margin-right: 8px; }
  h1 .ttl { display: inline-flex; align-items: center; }
  footer { text-align: center; color: #9aa3b5; font-size: 11px; margin-top: 22px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="ttl"><i data-lucide="calendar-days"></i>日程表</span></h1>
    <div class="date"><b id="today-date"></b><span id="today-week"></span></div>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="s-total">0</div><div class="lbl">全部条目</div></div>
    <div class="stat"><div class="num" id="s-today">0</div><div class="lbl">今天</div></div>
    <div class="stat"><div class="num" id="s-done">0</div><div class="lbl">已完成</div></div>
  </div>

  <div class="input-card">
    <div class="row">
      <input type="text" id="tx" placeholder="要做什么,比如：买牛奶" maxlength="80">
      <button class="btn-add" id="btn-add"><i data-lucide="plus"></i>添加</button>
    </div>
    <div class="quick-row" id="quick-row"></div>
    <div class="time-row">
      <label>时间</label>
      <input type="datetime-local" id="tx-time">
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-f="all">全部</button>
    <button class="tab" data-f="todo">未完成</button>
    <button class="tab" data-f="done">已完成</button>
  </div>

  <ul class="list" id="list"></ul>
  <div class="empty" id="empty" style="display:none">
    <i data-lucide="calendar-plus"></i>
    <div id="empty-msg">还没有日程,添一条试试</div>
  </div>

  <footer>快捷日程表 v0.1.0 · 数据保存在本机浏览器</footer>
</div>

<script src="vendor/lucide.min.js"></script>
<script>
(function () {
  'use strict';
  var KEY = 'quick-schedule-items-v1';
  var $ = function (s) { return document.querySelector(s); };

  /* ---------- 数据 ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* ignore */ }
    return null;
  }
  var seed = [
    { id: 'd1', text: '体验：这是一条示例日程', due: Date.now() + 3600e3, done: false },
    { id: 'd2', text: '体验：勾选它试试完成效果', due: Date.now() + 5 * 3600e3, done: false },
    { id: 'd3', text: '体验：点 × 删除这条', due: Date.now() + 26 * 3600e3, done: true }
  ];
  var items = load() || seed.map(function (x) { return x; });
  function save() { localStorage.setItem(KEY, JSON.stringify(items)); }
  function uid() { return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  /* ---------- 渲染 ---------- */
  var filter = 'all';
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtDT(ts) {
    var d = new Date(ts);
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var that = new Date(ts); that.setHours(0, 0, 0, 0);
    var diff = Math.round((that - today) / 86400e3);
    var day;
    if (diff === 0) day = '今天';
    else if (diff === 1) day = '明天';
    else day = (d.getMonth() + 1) + '月' + d.getDate() + '日';
    var w = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
    var hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    var overdue = !itemDoneFlag && ts < Date.now();
    return { day: day, hm: hm, str: day + ' 周' + w + ' ' + hm };
  }

  var itemDoneFlag = false;

  function render() {
    var now = new Date(); now.setHours(0, 0, 0, 0);
    var todayTs = now.getTime();
    var shown = items.filter(function (it) {
      if (filter === 'todo' && it.done) return false;
      if (filter === 'done' && !it.done) return false;
      return true;
    }).sort(function (a, b) { return a.due - b.due; });

    var list = $('#list');
    list.innerHTML = '';
    shown.forEach(function (it) {
      itemDoneFlag = it.done;
      var d = fmtDT(it.due);
      var li = document.createElement('li');
      li.className = 'item' + (it.done ? ' done' : '');
      var over = (!it.done && it.due < Date.now()) ? ' <span style="color:#e05a5a;font-weight:600">已过期</span>' : '';
      li.innerHTML =
        '<div class="check" data-act="toggle"><i data-lucide="check"></i></div>' +
        '<div class="body"><div class="txt"></div><div class="when">' +
        '<span class="tag">' + d.day + '</span> ' + d.hm + over + '</div></div>' +
        '<button class="del" data-act="del"><i data-lucide="trash-2"></i></button>';
      li.querySelector('.txt').textContent = it.text;
      li.querySelector('.check').addEventListener('click', function () { it.done = !it.done; save(); render(); });
      li.querySelector('.del').addEventListener('click', function () {
        items = items.filter(function (x) { return x.id !== it.id; }); save(); render();
      });
      list.appendChild(li);
    });

    var nToday = items.filter(function (it) { return it.due >= todayTs && it.due < todayTs + 86400e3; }).length;
    $('#s-total').textContent = items.length;
    $('#s-today').textContent = nToday;
    $('#s-done').textContent = items.filter(function (it) { return it.done; }).length;

    var empty = $('#empty');
    if (shown.length === 0) {
      empty.style.display = '';
      $('#empty-msg').textContent = filter === 'done' ? '还没有已完成的事项' : filter === 'todo' ? '没有未完成的事项' : '还没有日程,添一条试试';
    } else { empty.style.display = 'none'; }

    if (window.lucide) lucide.createIcons();
  }

  /* ---------- 添加 ---------- */
  var QUICK = [
    { label: '现在', off: 6e4 },
    { label: '半小时后', off: 30 * 6e4 },
    { label: '今晚 8 点', at: function () { var d = new Date(); d.setHours(20, 0, 0, 0); if (d < new Date()) d.setDate(d.getDate() + 1); return d.getTime(); } },
    { label: '明天早上', at: function () { var d = new Date(); d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); return d.getTime(); } }
  ];
  var tx = $('#tx'), txTime = $('#tx-time'), qr = $('#quick-row');

  function dtLocal(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function defaultDue() { return Date.now() + 3600e3; }

  QUICK.forEach(function (q) {
    var b = document.createElement('button');
    b.className = 'chip'; b.textContent = q.label;
    b.addEventListener('click', function () {
      var ts = q.at ? q.at() : Date.now() + q.off;
      txTime.value = dtLocal(ts);
      qr.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
      b.classList.add('active');
    });
    qr.appendChild(b);
  });

  txTime.value = dtLocal(defaultDue());

  function add() {
    var text = tx.value.trim();
    if (!text) { tx.focus(); return; }
    var due = txTime.value ? new Date(txTime.value).getTime() : defaultDue();
    if (isNaN(due)) due = defaultDue();
    items.push({ id: uid(), text: text, due: due, done: false });
    save();
    tx.value = ''; tx.focus();
    filter = 'all';
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t.dataset.f === 'all'); });
    render();
  }
  $('#btn-add').addEventListener('click', add);
  tx.addEventListener('keydown', function (e) { if (e.key === 'Enter') add(); });

  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      filter = t.dataset.f;
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('active', x === t); });
      render();
    });
  });

  /* ---------- 顶部日期 ---------- */
  (function () {
    var d = new Date();
    var w = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
    $('#today-week').textContent = '星期' + w;
    $('#today-date').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日';
  })();

  render();
})();
</script>
</body>
</html>
