<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="快捷日程表">
<meta name="theme-color" content="#0b0e14">
<title>快捷日程表</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0e14;
    --panel: #10141d;
    --card: #161c28;
    --card-2: #1b2231;
    --line: #232b3d;
    --line-soft: #1a2130;
    --text: #e7ebf3;
    --text-2: #8b93a7;
    --text-3: #5b6478;
    --accent: #5b8cff;
    --accent-soft: rgba(91, 140, 255, .16);
    --accent-line: rgba(91, 140, 255, .55);
    --danger: #ff6b6b;
    --ok: #4cc38a;
    --now: #ff5b5b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  .app {
    display: flex;
    height: calc(100dvh - 62px);
    padding: 10px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    gap: 14px;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left));
  }
  .day-switch { display: flex; background: var(--card); border-radius: 10px; padding: 3px; gap: 3px; }
  .day-switch button {
    border: 0; background: transparent; color: var(--text-2);
    font-size: 14px; font-weight: 600; padding: 7px 20px; border-radius: 8px; cursor: pointer;
  }
  .day-switch button.active { background: var(--accent); color: #fff; }
  .top-date { font-size: 14px; color: var(--text-2); }
  aside {
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column;
    background: var(--panel);
    border-radius: 18px;
    padding: 18px;
    overflow-y: auto;
  }
  main {
    flex: 1 1 0; min-width: 0;
    background: var(--panel);
    border-radius: 18px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* ---------- 左栏:表单 ---------- */
  .add-btn {
    width: 44px; height: 44px; border-radius: 22px; border: 0;
    background: var(--accent); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .add-btn svg { width: 22px; height: 22px; }
  .add-btn:active { opacity: .85; }
  .cancel-btn {
    width: 44px; height: 44px; border-radius: 22px;
    border: 1px solid var(--line); background: var(--card); color: var(--text-2); cursor: pointer;
    display: none; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .cancel-btn svg { width: 18px; height: 18px; }
  .aside-bottom { margin-top: auto; display: flex; align-items: center; gap: 12px; padding-top: 14px; }
  .lead-wrap { position: relative; display: flex; gap: 6px; margin-left: auto; }
  .lead-wrap::before, .lead-wrap::after {
    content: ''; position: absolute; left: 0; right: 0; height: 18px; z-index: 3; pointer-events: none;
  }
  .lead-wrap::before { top: 0; background: linear-gradient(to bottom, var(--panel) 20%, rgba(16, 20, 29, 0)); }
  .lead-wrap::after { bottom: 0; background: linear-gradient(to top, var(--panel) 20%, rgba(16, 20, 29, 0)); }
  .form-card { background: var(--card); border-radius: 16px; padding: 14px 16px 16px; }
  .form-card .f-label { font-size: 12px; color: var(--text-2); margin-bottom: 6px; display: block; }
  .form-card input[type=text], .form-card textarea {
    width: 100%; font-size: 16px; padding: 11px 13px; margin-bottom: 12px;
    border: 1px solid var(--line); border-radius: 12px; outline: none;
    background: var(--card-2); color: var(--text); font-family: inherit;
  }
  .form-card input:focus, .form-card textarea:focus { border-color: var(--accent); }
  .form-card textarea { resize: none; min-height: 58px; }
  .time-row { display: flex; gap: 14px; margin-bottom: 12px; }
  .time-row .t-col { flex: 1; min-width: 0; }
  .time-row .t-col .f-label { margin-bottom: 6px; }
  .wheel-pair { position: relative; display: flex; gap: 6px; }
  .wheel {
    flex: 1; min-width: 0; height: 108px; overflow-y: auto;
    scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch;
    scrollbar-width: none; overscroll-behavior: contain;
  }
  .wheel::-webkit-scrollbar { display: none; }
  .wheel .wheel-items { padding: 36px 0; }
  .wheel .wi {
    height: 36px; scroll-snap-align: center;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; color: var(--text-2);
    font-variant-numeric: tabular-nums; cursor: pointer;
    transition: color .12s;
  }
  .wheel .wi.sel { color: var(--text); font-weight: 700; font-size: 17px; }
  .wheel.wheel-sm { height: 88px; }
  .wheel.wheel-sm .wheel-items { padding: 30px 0; }
  .wheel.wheel-sm .wi { height: 28px; font-size: 14px; }
  .wheel.wheel-sm .wi.sel { font-size: 15px; }
  .wheel-pair::before, .wheel-pair::after {
    content: ''; position: absolute; left: 0; right: 0; height: 20px; z-index: 3; pointer-events: none;
  }
  .wheel-pair::before { top: 0; background: linear-gradient(to bottom, var(--card) 15%, rgba(22, 28, 40, 0)); }
  .wheel-pair::after { bottom: 0; background: linear-gradient(to top, var(--card) 15%, rgba(22, 28, 40, 0)); }

  .day-summary { margin-top: 14px; font-size: 13px; color: var(--text-2); display: flex; gap: 14px; align-items: center; }
  .day-summary b { color: var(--text); }

  /* ---------- 右栏:时间线 ---------- */
  .tl-head {
    padding: 13px 16px 11px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--line-soft);
  }
  .tl-head .day { font-size: 18px; font-weight: 700; }
  .tl-head .meta { font-size: 12px; color: var(--text-2); margin-right: 8px; }
  .tl-head .right { display: flex; align-items: center; gap: 12px; }
  .btn-copy, .btn-clear {
    border: 0; background: transparent; color: var(--text-2);
    padding: 6px; border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-copy svg, .btn-clear svg { width: 20px; height: 20px; }
  .btn-copy:active { color: var(--accent); }
  .btn-clear:active { color: var(--danger); }
  .tl-scroll { flex: 1; overflow-y: auto; position: relative; overscroll-behavior: contain; }
  .tl-body { position: relative; min-height: 100%; }
  .tl-axis { position: sticky; left: 0; width: 54px; float: left; z-index: 3; background: var(--panel); }
  .tl-grid-wrap { margin-left: 54px; position: relative; }
  .hour { height: 52px; border-top: 1px solid var(--line); position: relative; }
  .hour.half::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; border-top: 1px dashed var(--line-soft); }
  .hour-label {
    position: absolute; top: -7px; right: 8px; z-index: 3;
    font-size: 11px; color: var(--text-3); background: var(--panel);
  }
  .evt {
    position: absolute; border-radius: 12px;
    background: var(--accent-soft);
    border: 1px solid var(--accent-line);
    border-left: 3px solid var(--accent);
    padding: 7px 32px 7px 11px; overflow: hidden; cursor: pointer;
  }
  .evt .t { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .evt .m { font-size: 11px; color: var(--text-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .evt .del-btn {
    position: absolute; top: 5px; right: 5px;
    width: 22px; height: 22px; border-radius: 7px; border: 0;
    background: rgba(0,0,0,.22); color: var(--text-2);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .evt .del-btn svg { width: 13px; height: 13px; }
  .evt .del-btn:active { background: var(--danger); color: #fff; }
  .now-line { position: absolute; left: 54px; right: 0; height: 2px; background: var(--now); z-index: 4; pointer-events: none; }
  .now-line::before {
    content: ''; position: absolute; top: -4px; left: -4px;
    width: 10px; height: 10px; border-radius: 50%; background: var(--now);
  }
  .tl-empty {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    color: var(--text-3); font-size: 14px; z-index: 0;
  }
  .tl-empty svg { width: 52px; height: 52px; }

  .toast {
    position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
    background: var(--card-2); border: 1px solid var(--line); color: var(--text);
    padding: 11px 18px; border-radius: 12px; font-size: 14px; z-index: 99;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 700px) {
    .app { flex-direction: column; overflow-y: auto; }
    main { min-height: 70vh; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="day-switch" id="day-switch">
    <button data-day="today" class="active">今天</button>
    <button data-day="tomorrow">明天</button>
  </div>
  <div class="top-date" id="top-date"></div>
</div>
<div class="app">
  <!-- 左栏:表单 -->
  <aside>
    <div class="form-card">
      <input type="text" id="f-title" placeholder="任务名" maxlength="60">
      <textarea id="f-note" placeholder="备注" maxlength="300"></textarea>
      <div class="time-row">
        <div class="t-col">
          <label class="f-label">开始时间</label>
          <div class="wheel-pair">
            <div class="wheel" id="wsh"></div>
            <div class="wheel" id="wsm"></div>
          </div>
        </div>
        <div class="t-col">
          <label class="f-label">结束时间</label>
          <div class="wheel-pair">
            <div class="wheel" id="weh"></div>
            <div class="wheel" id="wem"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="day-summary" id="day-summary"></div>

    <div class="aside-bottom">
      <button class="cancel-btn" id="btn-cancel-edit" title="取消编辑"><i data-lucide="x"></i></button>
      <button class="add-btn" id="btn-submit" title="添加/保存"><i data-lucide="plus"></i></button>
      <div class="lead-wrap">
        <div class="wheel wheel-sm" id="wl"></div>
      </div>
    </div>
  </aside>

  <!-- 右栏:时间线 -->
  <main>
    <div class="tl-head">
      <div class="day" id="tl-day">今天</div>
      <div class="right">
        <div class="meta" id="tl-meta"></div>
        <button class="btn-clear" id="btn-clear" title="清空当天"><i data-lucide="trash-2"></i></button>
        <button class="btn-copy" id="btn-copy" title="复制当天日程 JSON"><i data-lucide="copy"></i></button>
      </div>
    </div>
    <div class="tl-scroll" id="tl-scroll">
      <div class="tl-body" id="tl-body">
        <div class="tl-axis" id="tl-axis"></div>
        <div class="tl-grid-wrap" id="tl-grid"></div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="vendor/lucide.min.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var HOUR_H = 52;               // 每小时像素

  /* ================= 数据 ================= */
  var KEY = 'quick-schedule-items-v1';
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* ignore */ }
    return [];
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(items)); }
  function uid() { return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  var items = load() || [];
  items.forEach(function (it) { if (typeof it.leadMin !== 'number') it.leadMin = 5; });
  // 形如 { id, title, note, day:'YYYY-MM-DD', startMin, endMin }

  /* ================= 日期工具 ================= */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dayKey(offset) {
    var d = new Date(); d.setDate(d.getDate() + offset); d.setHours(0, 0, 0, 0);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
  function dayLabel(dk) {
    var p = dk.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return (+p[1]) + '月' + (+p[2]) + '日 周' + WEEK[d.getDay()];
  }
  function minsToHHMM(m) { return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }

  /* ================= 状态 ================= */
  var selDay = 'today';          // today | tomorrow
  var day = dayKey(0);           // 当前显示的日期 key
  var editingId = null;          // 编辑中的任务 id

  /* ================= 表单 ================= */
  var fTitle = $('#f-title'), fNote = $('#f-note');
  /* 网页内嵌滚轮(直接嵌在表单里):触屏/滚轮滚动,scroll-snap 吸附,居中选择,
     小时 00-23 × 分钟 00/05/.../55,真正 5 分钟一档 */
  var ITEM_H = 36;
  var CAN_SMOOTH = 'scrollBehavior' in document.documentElement.style;
  function makeWheel(el, items, onChange, itemH) {
    itemH = itemH || ITEM_H;
    el.innerHTML = '<div class="wheel-items">' + items.map(function (v, i) {
      return '<div class="wi" data-i="' + i + '">' + v + '</div>';
    }).join('') + '</div>';
    var ticking = false;
    var moved = 0, startY = null, lastVal = 0;
    function getVal() { return lastVal; }
    function apply(v) {
      var wis = el.querySelectorAll('.wi');
      for (var i = 0; i < wis.length; i++) wis[i].classList.toggle('sel', i === v);
      if (v !== lastVal) {
        lastVal = v;
        if (onChange) onChange();
      }
    }
    function setVal(v, smooth) {
      v = Math.max(0, Math.min(items.length - 1, v));
      var top = v * itemH;
      if (smooth && CAN_SMOOTH) el.scrollTo({ top: top, behavior: 'smooth' });
      else el.scrollTop = top;
      apply(v);
    }
    el.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        ticking = false;
        apply(Math.max(0, Math.min(items.length - 1, Math.round(el.scrollTop / itemH))));
      });
    });
    // 记录触摸位移:拖动后松手会派发 click,需忽略,避免滚轮被误跳
    el.addEventListener('touchstart', function (e) { startY = e.touches[0].clientY; moved = 0; }, { passive: true });
    el.addEventListener('touchmove', function (e) {
      if (startY !== null) moved = Math.max(moved, Math.abs(e.touches[0].clientY - startY));
    }, { passive: true });
    el.addEventListener('click', function (e) {
      if (moved > 12) return;
      var w = e.target.closest('.wi');
      if (w) setVal(+w.dataset.i, true);
    });
    apply(0);
    return { getVal: getVal, setVal: setVal };
  }
  function round5(m) { return Math.round(m / 5) * 5; }   // 时间对齐到 5 分钟
  var HOURS = [], MINS = [];
  for (var _h = 0; _h < 24; _h++) HOURS.push(pad(_h));
  for (var _m = 0; _m < 60; _m += 5) MINS.push(pad(_m));
  var wStartH = makeWheel($('#wsh'), HOURS, enforceEnd), wStartM = makeWheel($('#wsm'), MINS, enforceEnd);
  var wEndH = makeWheel($('#weh'), HOURS), wEndM = makeWheel($('#wem'), MINS);
  /* 结束时间必须晚于开始时间至少 5 分钟:开始滚轮每次变化后联动修正 */
  function enforceEnd() {
    var s = getTimeSel([wStartH, wStartM]);
    var e = getTimeSel([wEndH, wEndM]);
    if (e < s + 5) setTimeSel([wEndH, wEndM], Math.min(s + 5, 1435), true);
  }
  /* 提醒提前量滚轮:5min / 30min / 1h */
  var LEAD_TICKS = [5, 30, 60];
  var wLead = makeWheel($('#wl'), ['5min', '30min', '1h'], null, 28);   // 小滚轮 item 高 28px
  function getLead() { return LEAD_TICKS[wLead.getVal()]; }
  function setLead(m) { var i = LEAD_TICKS.indexOf(m); wLead.setVal(i === -1 ? 1 : i, false); }
  setLead(5);   // 默认档 5min
  function setTimeSel(sels, min, smooth) {
    min = round5(Math.max(0, Math.min(min, 1440 - 5)));
    sels[0].setVal(Math.floor(min / 60), smooth);
    sels[1].setVal(Math.floor((min % 60) / 5), smooth);   // 分钟滚轮:每档 5 分钟,index = 分钟/5
  }
  function getTimeSel(sels) {
    return sels[0].getVal() * 60 + sels[1].getVal() * 5;  // 档位 → 分钟数
  }
  function defaultTimes() {
    var d = new Date();
    var m = round5(d.getHours() * 60 + d.getMinutes() + 30); // 最近 5 分钟刻度 + 30 分钟
    if (m >= 1440) m = 1410;
    setTimeSel([wStartH, wStartM], m);
    setTimeSel([wEndH, wEndM], Math.min(m + 60, 1439));
  }
  defaultTimes();

  function submit() {
    var title = fTitle.value.trim();
    if (!title) { toast('请先填写任务名'); fTitle.focus(); return; }
    var startMin = getTimeSel([wStartH, wStartM]);   // 5 分钟步进
    var endMin = getTimeSel([wEndH, wEndM]);
    if (endMin < startMin + 5) {
      endMin = Math.min(startMin + 5, 1435);
      toast('结束时间已调整为开始 + 5 分钟');
    }
    if (editingId) {
      var it = items.find(function (x) { return x.id === editingId; });
      if (it) { it.title = title; it.note = fNote.value.trim(); it.startMin = startMin; it.endMin = endMin; it.leadMin = getLead(); }
      editingId = null; setEditMode(false);
      toast('已保存修改');
    } else {
      items.push({ id: uid(), title: title, note: fNote.value.trim(), day: day, startMin: startMin, endMin: endMin, leadMin: getLead() });
      toast('已添加到' + (selDay === 'today' ? '今天' : '明天'));
    }
    save();
    clearForm();
    render();
  }
  function clearForm() { fTitle.value = ''; fNote.value = ''; defaultTimes(); }
  $('#btn-submit').addEventListener('click', submit);
  fTitle.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });

  /* ================= 编辑模式(左侧直接编辑,不弹键盘) ================= */
  function setEditMode(on) {
    $('#btn-cancel-edit').style.display = on ? 'flex' : 'none';
    $('#btn-submit').innerHTML = on ? '<i data-lucide="check"></i>' : '<i data-lucide="plus"></i>';
    if (window.lucide) lucide.createIcons();
  }
  function loadEdit(it) {
    editingId = it.id;
    fTitle.value = it.title;
    fNote.value = it.note || '';
    setTimeSel([wStartH, wStartM], it.startMin);
    setTimeSel([wEndH, wEndM], it.endMin);
    setLead(it.leadMin);
    enforceEnd();
    setEditMode(true);
    toast('正在编辑：' + it.title);
    // 故意不 focus:不在 iPad 上自动弹键盘
  }
  function cancelEdit() {
    editingId = null; setEditMode(false);
    clearForm();
  }
  $('#btn-cancel-edit').addEventListener('click', cancelEdit);

  /* ================= 今天/明天切换 ================= */
  $('#day-switch').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-day]');
    if (!btn) return;
    selDay = btn.dataset.day;
    day = dayKey(selDay === 'tomorrow' ? 1 : 0);
    document.querySelectorAll('#day-switch button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    cancelEdit();
    render();
    scrollToMin((selDay === 'today' && new Date().getHours() > 1) ? new Date().getHours() * 60 : 7 * 60);
  });

  /* ================= 渲染:时间线 ================= */
  var tlBody = $('#tl-body'), tlGrid = $('#tl-grid'), tlAxis = $('#tl-axis'), tlScroll = $('#tl-scroll');

  function buildGridOnce() {
    if (tlGrid.dataset.built) return;
    var html = '';
    for (var h = 0; h < 24; h++) html += '<div class="hour' + (h > 0 ? ' half' : '') + '"></div>';
    tlGrid.innerHTML = html;
    tlGrid.dataset.built = '1';
    var ax = '';
    for (var h2 = 0; h2 < 24; h2++) ax += '<div class="hour-label" style="top:' + (h2 * HOUR_H - 7) + 'px">' + pad(h2) + ':00</div>';
    tlAxis.innerHTML = ax;
    tlAxis.style.height = (24 * HOUR_H) + 'px';
    tlGrid.style.height = (24 * HOUR_H) + 'px';
  }

  // 经典日历冲突分列
  function layoutCols(dayItems) {
    var sorted = dayItems.slice().sort(function (a, b) { return a.startMin - b.startMin || a.endMin - b.endMin; });
    var groups = [], cur = [];
    function flush() {
      if (!cur.length) return;
      var cols = [], maxEnd = 0;
      cur.forEach(function (it) {
        var placed = false;
        for (var c = 0; c < cols.length; c++) {
          if (cols[c] <= it.startMin) { cols[c] = it.endMin; it.col = c; placed = true; break; }
        }
        if (!placed) { cols.push(it.endMin); it.col = cols.length - 1; }
        maxEnd = Math.max(maxEnd, it.endMin);
      });
      groups.push({ items: cur, n: cols.length });
      cur = [];
    }
    var lastEnd = -1;
    sorted.forEach(function (it) {
      if (cur.length && it.startMin >= lastEnd) flush();
      cur.push(it);
      lastEnd = Math.max(lastEnd, it.endMin);
    });
    flush();
    return groups;
  }

  function render() {
    buildGridOnce();
    tlGrid.querySelectorAll('.evt').forEach(function (n) { n.remove(); });
    var nl = document.querySelector('.now-line'); if (nl) nl.remove();
    var empty = document.querySelector('.tl-empty'); if (empty) empty.remove();

    var dayItems = items.filter(function (it) { return it.day === day; });
    var groups = layoutCols(dayItems);

    var w = tlGrid.clientWidth;
    groups.forEach(function (g) {
      var colW = w / g.n;
      g.items.forEach(function (it) {
        var top = it.startMin / 60 * HOUR_H;
        var end = Math.min(it.endMin, 1440);
        var h = Math.max((end - it.startMin) / 60 * HOUR_H, 26);
        var el = document.createElement('div');
        el.className = 'evt';
        el.style.top = top + 'px';
        el.style.height = h + 'px';
        el.style.left = (it.col * colW + 4) + 'px';
        el.style.width = (colW - 8) + 'px';
        var tt = document.createElement('div');
        tt.className = 't'; tt.textContent = it.title;
        var mm = document.createElement('div');
        mm.className = 'm';
        mm.textContent = minsToHHMM(it.startMin) + ' – ' + minsToHHMM(Math.min(it.endMin, 1439)) + (it.note ? ' · ' + it.note : '');
        var db = document.createElement('button');
        db.className = 'del-btn'; db.title = '删除';
        db.innerHTML = '<i data-lucide="trash-2"></i>';
        db.addEventListener('click', function (ev) {
          ev.stopPropagation();
          items = items.filter(function (x) { return x.id !== it.id; });
          if (editingId === it.id) cancelEdit();
          save(); render(); toast('已删除：' + it.title);
        });
        el.appendChild(tt); el.appendChild(mm); el.appendChild(db);
        el.addEventListener('click', function () { loadEdit(it); });
        tlGrid.appendChild(el);
      });
    });

    // 当前时刻线(仅今天)
    if (selDay === 'today') {
      var now = new Date();
      var line = document.createElement('div');
      line.className = 'now-line';
      line.style.top = ((now.getHours() * 60 + now.getMinutes()) / 60 * HOUR_H) + 'px';
      tlScroll.appendChild(line);
    }

    if (dayItems.length === 0) {
      var em = document.createElement('div');
      em.className = 'tl-empty';
      em.innerHTML = '<i data-lucide="calendar-plus"></i><span>这一天还没有安排</span>';
      tlScroll.appendChild(em);
    }

    $('#tl-day').textContent = selDay === 'today' ? '今天' : '明天';
    $('#top-date').textContent = dayLabel(day);
    $('#tl-meta').textContent = dayItems.length + ' 项';

    var total = dayItems.reduce(function (s, it) { return s + Math.max((it.endMin - it.startMin), 30); }, 0);
    $('#day-summary').innerHTML = '<span>当天 <b>' + dayItems.length + '</b> 项</span><span>总时长 <b>' +
      Math.floor(total / 60) + ' 小时 ' + Math.round(total % 60) + ' 分</b></span>';

    if (window.lucide) lucide.createIcons();
  }
  function scrollToMin(m) {
    tlScroll.scrollTop = Math.max(0, m / 60 * HOUR_H - HOUR_H * 2.5);
  }

  /* ================= 一键清空当天 ================= */
  $('#btn-clear').addEventListener('click', function () {
    var dayItems = items.filter(function (it) { return it.day === day; });
    if (!dayItems.length) { toast('这一天没有任务'); return; }
    items = items.filter(function (it) { return it.day !== day; });
    if (editingId && !items.some(function (x) { return x.id === editingId; })) cancelEdit();
    save(); render();
    toast('已清空当天 ' + dayItems.length + ' 项');
  });

  /* ================= 复制 JSON ================= */
  $('#btn-copy').addEventListener('click', function () {
    var dayItems = items.filter(function (it) { return it.day === day; });
    if (!dayItems.length) { toast('这一天没有任务,没有可复制的'); return; }
    var payload = {
      '_说明': '快捷日程表导出(字段含义): day=任务所属日期(YYYY-MM-DD); title=任务名; note=备注文字(可为空); startMin=开始时间,当天0点起的分钟数(如 9:30=570); endMin=结束时间,分钟数(可大于1440,表示跨午夜,时间线显示截断到24:00); leadMin=提前提醒分钟数(5/30/60)',
      '导出日期': day,
      '日期标签': selDay === 'today' ? '今天' : '明天',
      '任务数': dayItems.length,
      'items': dayItems.map(function (it) { return { day: it.day, title: it.title, note: it.note || '', startMin: it.startMin, endMin: it.endMin, leadMin: it.leadMin }; })
    };
    var text = JSON.stringify(payload, null, 2);
    function done() { toast('已复制 ' + dayItems.length + ' 条 JSON 到剪贴板'); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
    } else {
      fallbackCopy(text); done();
    }
  });
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) { /* ignore */ }
    ta.remove();
  }

  /* ================= 工具 ================= */
  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  /* ================= 启动 ================= */
  window.addEventListener('resize', function () { render(); });
  setInterval(function () { if (selDay === 'today') render(); }, 60000);
  render();
  var nowMin = new Date().getHours() * 60 + new Date().getMinutes();
  scrollToMin(nowMin > 60 ? nowMin : 7 * 60);
})();
</script>
</body>
</html>
